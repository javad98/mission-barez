<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f766e"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>هزینه‌های ماموریت</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f5f1;--card:#fff;--tx:#1f2328;--mut:#6b7280;--ac:#0f766e;--acx:#fff;--bd:#e5e2d9;--bad:#b91c1c;--ok:#0f766e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14181a;--card:#1e2427;--tx:#eceff1;--mut:#9aa5ab;--ac:#2dd4bf;--acx:#06201d;--bd:#2f393d;--bad:#f87171;--ok:#2dd4bf}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14181a;--card:#1e2427;--tx:#eceff1;--mut:#9aa5ab;--ac:#2dd4bf;--acx:#06201d;--bd:#2f393d;--bad:#f87171;--ok:#2dd4bf}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;font-size:16px;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input{width:100%;padding:11px 12px;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 16px;background:var(--ac);color:var(--acx);font-weight:600}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.del{background:transparent;color:var(--bad);padding:4px 8px}
.row{display:flex;gap:8px;align-items:center}
.row>input{flex:1}
.big{font-size:34px;font-weight:700;text-align:center;margin:2px 0}
.ok{color:var(--ok)}.neg{color:var(--bad)}
.mut{color:var(--mut);font-size:14px;text-align:center}
.item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}
.mi{cursor:pointer}
.mic{width:46px;height:46px;border-radius:50%;padding:0;font-size:20px}
.mic.on{background:var(--bad);color:#fff}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:var(--ac)}
.msg{font-size:14px;color:var(--mut);margin-top:6px;min-height:20px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function(){
var KEY='mission_expenses_v1',S={missions:[],active:null,view:'list'},app=document.getElementById('app'),msg='';
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.missions)S.missions=p.missions}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({missions:S.missions}))}catch(e){}}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function fa(n){return Number(n).toLocaleString('fa-IR')}
function norm(s){return String(s).replace(/[۰-۹]/g,function(c){return c.charCodeAt(0)-1776}).replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632}).replace(/[,،٬]/g,'')}
function parse(text){
  var t=norm(text).trim(),m=t.match(/(\d+(?:\.\d+)?)(?!.*\d)/);
  if(!m)return null;
  var amt=parseFloat(m[1]),title=(t.slice(0,m.index)+' '+t.slice(m.index+m[1].length)).replace(/\s+/g,' ').trim();
  return {t:title||'بدون عنوان',a:amt}
}
function cur(){return S.missions.find(function(x){return x.id===S.active})}
function spent(m){return m.expenses.reduce(function(s,e){return s+e.a},0)}
function total(m){return m.amount*m.meals}
function render(){
  if(S.view==='new')return renderNew();
  if(S.view==='detail'&&cur())return renderDetail();
  S.view='list';renderList();
}
function renderList(){
  var h='<h1>ماموریت‌ها</h1><button id="n" style="width:100%;margin-bottom:12px">+ ماموریت جدید</button>';
  if(!S.missions.length)h+='<p class="mut">هنوز ماموریتی ثبت نشده.</p>';
  S.missions.slice().reverse().forEach(function(m){
    var r=total(m)-spent(m);
    h+='<div class="card mi" data-id="'+m.id+'"><div class="top"><b>'+esc(m.name)+'</b><span class="'+(r<0?'neg':'ok')+'">مانده: '+fa(r)+'</span></div><div class="mut" style="text-align:right">'+fa(m.meals)+' وعده × '+fa(m.amount)+' | خرج: '+fa(spent(m))+'</div></div>';
  });
  if(S.missions.length)h+='<button class="sec" id="xall" style="width:100%">خروجی اکسل همه ماموریت‌ها</button>';
  app.innerHTML=h;
  document.getElementById('n').onclick=function(){S.view='new';render()};
  var x=document.getElementById('xall');if(x)x.onclick=function(){exportXlsx(S.missions,'همه-ماموریت‌ها')};
  [].forEach.call(app.querySelectorAll('.mi'),function(el){el.onclick=function(){S.active=el.dataset.id;S.view='detail';msg='';render()}});
}
function renderNew(){
  app.innerHTML='<h1>ماموریت جدید</h1><div class="card"><label>نام ماموریت</label><input id="nm" placeholder="مثلاً ماموریت شیراز"><label>مبلغ هر وعده</label><input id="am" inputmode="numeric" placeholder="مثلاً 500"><label>تعداد وعده</label><input id="ml" inputmode="numeric" placeholder="مثلاً 6"><div class="row" style="margin-top:14px"><button id="ok" style="flex:1">شروع ماموریت</button><button class="sec" id="cn">انصراف</button></div><div class="msg" id="er"></div></div>';
  document.getElementById('cn').onclick=function(){S.view='list';render()};
  document.getElementById('ok').onclick=function(){
    var nm=document.getElementById('nm').value.trim(),am=parseFloat(norm(document.getElementById('am').value)),ml=parseInt(norm(document.getElementById('ml').value),10);
    if(!(am>0)||!(ml>0)){document.getElementById('er').textContent='مبلغ و تعداد وعده را درست وارد کن.';return}
    var m={id:'m'+Date.now(),name:nm||'ماموریت '+fa(S.missions.length+1),amount:am,meals:ml,expenses:[],created:new Date().toISOString()};
    S.missions.push(m);S.active=m.id;S.view='detail';save();render();
  };
}
function renderDetail(){
  var m=cur(),tt=total(m),sp=spent(m),r=tt-sp,pct=Math.min(100,Math.round(sp/tt*100));
  var editHtml=S.edit?'<label>مبلغ هر وعده</label><input id="ea" inputmode="numeric" value="'+m.amount+'"><label>تعداد وعده</label><input id="em" inputmode="numeric" value="'+m.meals+'"><div class="row" style="margin-top:10px"><button id="es" style="flex:1">ذخیره</button><button class="sec" id="ec">انصراف</button></div>':'<button class="sec" id="eb" style="margin-top:10px;width:100%">ویرایش تعداد وعده و مبلغ</button>';
  var h='<div class="top"><button class="sec" id="bk">← بازگشت</button><button class="del" id="dm">حذف ماموریت</button></div><h1>'+esc(m.name)+'</h1>'+
  '<div class="card"><div class="mut">مانده</div><div class="big '+(r<0?'neg':'ok')+'">'+fa(r)+'</div><div class="bar"><i style="width:'+pct+'%"></i></div><div class="mut">کل: '+fa(tt)+' ('+fa(m.meals)+' وعده × '+fa(m.amount)+') | خرج‌شده: '+fa(sp)+'</div>'+editHtml+'</div>'+
  '<div class="card"><label>هزینه جدید (مثلاً: قهوه 780)</label><div class="row"><input id="ex" placeholder="قهوه 780"><button id="ad">ثبت</button><button class="mic sec" id="mc" title="ورود صوتی">🎤</button></div><div class="msg" id="ms">'+esc(msg)+'</div></div>'+
  '<div class="card"><b>هزینه‌ها</b>';
  if(!m.expenses.length)h+='<p class="mut">هنوز هزینه‌ای ثبت نشده.</p>';
  m.expenses.slice().reverse().forEach(function(e,i){
    var idx=m.expenses.length-1-i;
    if(S.ei===idx){h+='<div class="item" style="gap:6px"><input id="ei" value="'+esc(e.t+' '+e.a).replace(/"/g,'&quot;')+'"><button id="eis">ذخیره</button><button class="sec" id="eic">✕</button></div>';return}
    h+='<div class="item"><span>'+esc(e.t)+'</span><span>'+fa(e.a)+' <button class="del" style="color:var(--tx)" data-e="'+idx+'">✎</button><button class="del" data-i="'+idx+'">✕</button></span></div>';
  });
  h+='</div><button id="xl" style="width:100%">ذخیره فایل اکسل این ماموریت</button>';
  app.innerHTML=h;
  document.getElementById('bk').onclick=function(){S.edit=false;S.ei=null;S.view='list';render()};
  var eb=document.getElementById('eb');if(eb)eb.onclick=function(){S.edit=true;render()};
  var ec=document.getElementById('ec');if(ec)ec.onclick=function(){S.edit=false;render()};
  var es=document.getElementById('es');if(es)es.onclick=function(){
    var a=parseFloat(norm(document.getElementById('ea').value)),n=parseInt(norm(document.getElementById('em').value),10);
    if(!(a>0)||!(n>0)){alert('مبلغ و تعداد وعده را درست وارد کن.');return}
    m.amount=a;m.meals=n;S.edit=false;save();msg='ویرایش شد. مانده جدید: '+fa(total(m)-spent(m));render();
  };
  document.getElementById('dm').onclick=function(){if(confirm('این ماموریت حذف شود؟')){S.missions=S.missions.filter(function(x){return x.id!==m.id});save();S.view='list';render()}};
  var inp=document.getElementById('ex');
  function add(text){
    var p=parse(text);
    if(!p){msg='مبلغ پیدا نشد. مثال: قهوه 780';document.getElementById('ms').textContent=msg;return}
    m.expenses.push({t:p.t,a:p.a,at:new Date().toISOString()});save();
    var rem=total(m)-spent(m);msg='ثبت شد: '+p.t+' — '+fa(p.a)+' | مانده: '+fa(rem);render();
  }
  document.getElementById('ad').onclick=function(){if(inp.value.trim())add(inp.value)};
  inp.onkeydown=function(e){if(e.key==='Enter'&&inp.value.trim())add(inp.value)};
  [].forEach.call(app.querySelectorAll('.del[data-i]'),function(b){b.onclick=function(){m.expenses.splice(+b.dataset.i,1);S.ei=null;save();msg='';render()}});
  [].forEach.call(app.querySelectorAll('[data-e]'),function(b){b.onclick=function(){S.ei=+b.dataset.e;render()}});
  var eis=document.getElementById('eis');
  if(eis){eis.onclick=function(){var p=parse(document.getElementById('ei').value);if(!p){alert('مبلغ پیدا نشد. مثال: قهوه 780');return}var e=m.expenses[S.ei];e.t=p.t;e.a=p.a;S.ei=null;save();msg='ویرایش شد. مانده: '+fa(total(m)-spent(m));render()};document.getElementById('eic').onclick=function(){S.ei=null;render()}}
  document.getElementById('xl').onclick=function(){exportXlsx([m],m.name)};
  var mc=document.getElementById('mc'),SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){mc.style.display='none'}
  else mc.onclick=function(){
    var rec=new SR();rec.lang='fa-IR';rec.interimResults=false;rec.maxAlternatives=1;
    mc.classList.add('on');document.getElementById('ms').textContent='در حال شنیدن...';
    rec.onresult=function(ev){var tx=ev.results[0][0].transcript;mc.classList.remove('on');add(tx)};
    rec.onerror=function(ev){mc.classList.remove('on');document.getElementById('ms').textContent=(ev.error==='not-allowed'||ev.error==='service-not-allowed')?'دسترسی میکروفون مجاز نیست؛ هزینه را تایپ کن (یا از میکروفون کیبورد گوشی استفاده کن).':'صدا تشخیص داده نشد، دوباره امتحان کن.'};
    rec.onend=function(){mc.classList.remove('on')};
    try{rec.start()}catch(e){mc.classList.remove('on')}
  };
}
async function exportXlsx(list,name){
  var dl={save:function(o){var b=new Blob([o.data]),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=o.filename;document.body.appendChild(a);a.click();setTimeout(function(){a.remove();URL.revokeObjectURL(a.href)},1500);return Promise.resolve()}};
  var ms=document.getElementById('ms');
  function say(t){if(ms)ms.textContent=t;else alert(t)}
  if(!dl){say('ذخیره فایل در این نمایش ممکن نیست.');return}
  var rows=[['ماموریت','مبلغ هر وعده','تعداد وعده','کل بودجه','عنوان هزینه','مبلغ','تاریخ','مانده بعد از هزینه']];
  list.forEach(function(m){
    var rem=total(m);
    if(!m.expenses.length)rows.push([m.name,m.amount,m.meals,total(m),'','','',rem]);
    m.expenses.forEach(function(e){rem-=e.a;rows.push([m.name,m.amount,m.meals,total(m),e.t,e.a,(e.at||'').slice(0,16).replace('T',' '),rem])});
  });
  var fn=name.replace(/[\\\/:*?"<>|]/g,'-');
  try{
    if(window.XLSX){
      var ws=XLSX.utils.aoa_to_sheet(rows),wb=XLSX.utils.book_new();
      ws['!cols']=[{wch:18},{wch:12},{wch:10},{wch:12},{wch:20},{wch:10},{wch:18},{wch:16}];
      XLSX.utils.book_append_sheet(wb,ws,'هزینه‌ها');
      await dl.save({filename:fn+'.xlsx',data:XLSX.write(wb,{bookType:'xlsx',type:'array'})});
    }else{
      var csv='\uFEFF'+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
      await dl.save({filename:fn+'.csv',data:csv});
    }
    say('فایل ذخیره شد.');
  }catch(e){if(!e||e.code!=='declined')say('ذخیره فایل انجام نشد.')}
}
render();
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});</script>
</body>
</html>
